name: Sync projects and deploy Playground

on:
  push:
    branches: [main]
  schedule:
    # Daily at 08:17 Singapore time (UTC+8).
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test discovery and manifest handling
        run: node --test tests/*.test.mjs
      - name: Discover published projects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-projects.mjs
      - name: Build production artifact
        run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
